<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200"><style>
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
.sway{animation:sway 5.5s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.7}35%{opacity:1}55%{opacity:.82}75%{opacity:.95}}
.flick{animation:flick 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(9px,14px) rotate(16deg)}}
.drift{animation:drift 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 180s linear infinite;transform-origin:600px 600px}
.spin-rev{animation:spin 240s linear infinite reverse;transform-origin:600px 600px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bob{animation:bob 6s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:.2;transform:translateX(-16px)}50%{opacity:.75;transform:translateX(16px)}}
.shim{animation:shim 5s ease-in-out infinite}
@keyframes cloud{0%,100%{transform:translateX(-40px)}50%{transform:translateX(40px)}}
.cloud{animation:cloud 26s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:.75}100%{transform:translateY(-130px);opacity:0}}
.rise{animation:rise 4.5s ease-out infinite}
@keyframes fly{0%{transform:translate(-260px,30px)}100%{transform:translate(1460px,-60px)}}
.fly{animation:fly 26s linear infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
.flap{animation:flap .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flame{0%,100%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.88,1.14) rotate(2deg)}}
.flame{animation:flame 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(140px)}}
.walk{animation:walk 44s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.04)}24%{transform:scale(1)}36%{transform:scale(1.06)}60%{transform:scale(1)}}
.beat{animation:beat 2.6s ease-in-out infinite;transform-origin:600px 600px}
@keyframes glint{0%,70%,100%{opacity:0}80%{opacity:.9}}
.glint{animation:glint 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="tp" width="120" height="120" patternUnits="userSpaceOnUse">
